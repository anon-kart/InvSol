[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invsol-postcond"
version = "0.0.1"
description = "Mini project: Postcondition Inference Module for Solidity (AST + Foundry logs)"
authors = [{name="Your Name"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
pythonpath = ["src"]
