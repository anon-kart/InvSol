[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "invsol-audit"
version = "0.1.0"
description = "Static Code Auditor for InvSol. Verifies candidate loop invariants with an SMT solver."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
solver = ["z3-solver>=4.12"]

[tool.setuptools.packages.find]
where = ["."]
include = ["invsol_audit*"]
